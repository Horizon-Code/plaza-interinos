# fly.toml app configuration file generated for plazainterinos-api on 2026-08-01T12:36:44+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'plazainterinos-api'
primary_region = 'cdg'

[build]
  dockerfile = '../apps/api/Dockerfile'

[env]
  CORS_ORIGIN = 'https://plazainterinos.es'
  # Base de los enlaces que genera la aplicacion. Antes caia a CORS_ORIGIN por
  # casualidad; explicito para que tocar uno no rompa el otro.
  APP_URL = 'https://plazainterinos.es'
  # Identificador publico de la app en Google. No es un secreto: viaja en cada
  # peticion de acceso y la propia API lo sirve al navegador. Por eso va aqui y
  # no en `fly secrets`. Sin el, nadie puede entrar.
  GOOGLE_CLIENT_ID = '962674203904-8238mb9hni25hd1agublufuos6a7nl4k.apps.googleusercontent.com'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
